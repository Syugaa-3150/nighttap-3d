function vsTick(dt){if(!VS.on||!VS.cur||!G||G.net!=='host')return;if(performance.now()-VS.cur.t0>75000){for(const s of ['h','g'])if(VS.cur&&VS.cur.sc[s]==null)vsScored(s,0)}}
function vsEnd(){VS.on=false;const res={t:'vsend',h:VS.h,g:VS.g,hist:VS.hist};netSend(res);vsShow(res,'h')}
function vsShow(m,me){const h=m.h|0,g=m.g|0;const win=h===g?'draw':(h>g?'h':'g');const hist=Array.isArray(m.hist)?m.hist.slice(0,10):[];
 openOv(`<div class="modal" style="width:520px;text-align:center"><h1>⚔ 対戦結果</h1><div style="font-size:24px;margin:8px 0">🔴 ホスト <b>${h}</b> 点　vs　🔵 ゲスト <b>${g}</b> 点</div><table style="margin:6px auto;font-size:13px">${hist.map(x=>`<tr><td style="padding:1px 8px">第${x.r|0}問</td><td style="padding:1px 8px">${RECIPES[x.o]?RECIPES[x.o].name.replace(/<[^>]*>/g,''):''}</td><td style="padding:1px 8px">${x.h|0} - ${x.g|0}</td></tr>`).join('')}</table>
 <div style="font-size:30px;margin:8px 0">${win==='draw'?'🤝 引き分け！':win===me?'🏆 あなたの勝ち！':'😣 あなたの負け…'}</div><button class="btn" id="vsOk">営業にもどる</button></div>`);if(win===me)applause();$('#vsOk').onclick=()=>{closeOv()}}
/* ---------- visual quality: drinks ---------- */
function roundedBox(s,r){const g=new THREE.BoxGeometry(s,s,s,4,4,4);const p=g.attributes.position,v=new THREE.Vector3(),h=s/2-r;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const c=V(clamp(v.x,-h,h),clamp(v.y,-h,h),clamp(v.z,-h,h));const d=v.clone().sub(c);if(d.length()>1e-6)d.setLength(r);v.copy(c.add(d));p.setXYZ(i,v.x,v.y,v.z)}g.computeVertexNormals();return g}
let ICEHQ=null,DROPM=null,BUBG=null;
function iceMatHQ(){if(ICEHQ)return ICEHQ;const t=canvasTex(128,128,(x,w,h)=>{const gr=x.createRadialGradient(w/2,h/2,4,w/2,h/2,w*.6);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.5,'rgba(235,245,255,.15)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.35)';for(let i=0;i<9;i++){x.beginPath();x.moveTo(Math.random()*w,Math.random()*h);x.lineTo(Math.random()*w,Math.random()*h);x.stroke()}});
 ICEHQ=new THREE.MeshPhysicalMaterial({color:0xf6fbff,map:t,transmission:.92,thickness:.025,ior:1.31,roughness:.06,metalness:0,clearcoat:1,clearcoatRoughness:.05,transparent:true,opacity:.95,envMapIntensity:2.2,specularIntensity:1});return ICEHQ}
function dropMat(){if(DROPM)return DROPM;const t=canvasTex(256,256,(x,w,h)=>{x.clearRect(0,0,w,h);for(let i=0;i<(HQ()?520:180);i++){const px=Math.random()*w,py=Math.random()*h,r=.6+Math.random()*(Math.random()<.08?4:1.8);const gr=x.createRadialGradient(px-r*.3,py-r*.3,0,px,py,r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.6,'rgba(230,240,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.beginPath();x.arc(px,py,r,0,7);x.fill()}x.fillStyle='rgba(255,255,255,.06)';x.fillRect(0,0,w,h)});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1.4);
 DROPM=new THREE.MeshStandardMaterial({map:t,transparent:true,opacity:.75,roughness:.15,metalness:0,depthWrite:false,envMapIntensity:1.5});return DROPM}
function upgradeGlass(gl){if(gl.def.metal||gl.def.copper||gl.type==='shaker')return;
 const ig=roundedBox(gl.def.inner.cone?.018:.024,gl.def.inner.cone?.004:.0055);gl.ices.forEach(ic=>{ic.geometry=ig;for(const ch of [...ic.children])ic.remove(ch);if(HQ())ic.material=iceMatHQ()});
 if(HQ()){const old=gl.liqMat;const m=new THREE.MeshPhysicalMaterial({color:0xe8a838,transparent:true,opacity:.92,roughness:.06,transmission:.35,thickness:.06,ior:1.34,attenuationColor:new THREE.Color(0xc87818),attenuationDistance:.08,emissive:0x000000,clearcoat:.4,depthWrite:false,envMapIntensity:1.6});gl.liqMat=m;gl.liq.material=m;old.dispose()}
 const pts=gl.def.prof.map(p=>new THREE.Vector2(p[0]*1.012+.0004,p[1]));const shell=new THREE.Mesh(new THREE.LatheGeometry(pts.filter((p,i)=>i<pts.length/2+1),32),dropMat());shell.visible=false;shell.renderOrder=4;shell.raycast=()=>{};gl.g.add(shell);gl.dropM=shell;
 if(HQ()){const fm=gl.foamM.material;fm.map=foamTex();fm.bumpMap=fm.map;fm.bumpScale=.6;fm.needsUpdate=true}gl.bub=null}
let FOAMT=null;function foamTex(){if(FOAMT)return FOAMT;FOAMT=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#fff8ec';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){const r=.8+Math.random()*3.2;x.strokeStyle=`rgba(200,180,150,${.15+Math.random()*.25})`;x.beginPath();x.arc(Math.random()*w,Math.random()*h,r,0,7);x.stroke()}});FOAMT.wrapS=FOAMT.wrapT=THREE.RepeatWrapping;return FOAMT}
const FIZZ=['soda','tonic','ginger','cola','pale','ipa','stout','weizen'];
function glassFx(gl,dt,t){if(!gl.dropM)return;const c=gl.c;const cold=c.ice||Object.keys(c.ings).some(k=>ING[k]&&ING[k].type==='tap');gl.dropM.visible=cold&&gl.liq.visible&&!gl.dirtyGlass;
 if(gl.liq.visible&&!gl.dirtyGlass&&gl._lc!==gl.liqMat.color.getHex()){const h={};gl.liqMat.color.getHSL(h);if(h.s>.08)gl.liqMat.color.setHSL(h.h,Math.min(1,h.s*1.35+.08),Math.max(.12,h.l*.86));gl._lc=gl.liqMat.color.getHex();if(HQ()&&gl.liqMat.attenuationColor)gl.liqMat.attenuationColor.copy(gl.liqMat.color).multiplyScalar(.7)}
 const fz=gl.liq.visible&&!gl.dirtyGlass&&Object.keys(c.ings).some(k=>FIZZ.includes(k)&&c.ings[k]>5);
 if(fz&&!gl.bub){if(!BUBG)BUBG=new THREE.SphereGeometry(1,6,4);const n=HQ()?28:10;const mm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,depthWrite:false});const im=new THREE.InstancedMesh(BUBG,mm,n);im.raycast=()=>{};im.renderOrder=3;im.userData.p=Array.from({length:n},()=>({a:Math.random()*6.28,r:Math.random(),y:Math.random(),s:.4+Math.random()*.8,z:.0006+Math.random()*.0009}));gl.g.add(im);gl.bub=im}
 if(gl.bub){gl.bub.visible=fz;if(fz){const n=gl.def.inner;const hL=gl.liq.geometry.parameters.height;const M4=new THREE.Matrix4();gl.bub.userData.p.forEach((b,i)=>{b.y+=dt*b.s*.6;if(b.y>1){b.y=0;b.a=Math.random()*6.28;b.r=Math.random()}const yy=b.y*hL;const rr=gl.radAt(yy)*.85*Math.sqrt(b.r);M4.makeScale(b.z,b.z,b.z).setPosition(Math.cos(b.a)*rr+Math.sin(t*3+i)*.0007,n.b+yy,Math.sin(b.a)*rr);gl.bub.setMatrixAt(i,M4)});gl.bub.instanceMatrix.needsUpdate=true}}}
function wedgeMesh(k){const c=new THREE.Color(ING[k].color);const R0=.03,th=.014;const fleshT=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#'+c.clone().lerp(new THREE.Color('#ffffff'),.55).getHexString();x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;for(let i=0;i<10;i++){const a=i/10*Math.PI*2;x.beginPath();x.moveTo(w/2,h/2);x.lineTo(w/2+Math.cos(a)*w/2,h/2+Math.sin(a)*h/2);x.stroke()}x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(w/2,h/2,10,0,7);x.fill()});
 const geo=new THREE.CylinderGeometry(R0,R0,th,20,1,false,0,Math.PI*.6);const peel=new THREE.MeshPhysicalMaterial({color:c.clone().multiplyScalar(.8),roughness:.35,clearcoat:.6});const flesh=new THREE.MeshPhysicalMaterial({map:fleshT,roughness:.25,transmission:HQ()?.3:0,transparent:true,opacity:.97,clearcoat:.8});
 const m=new THREE.Mesh(geo,[peel,flesh,flesh]);m.rotation.x=Math.PI/2;const g=new THREE.Group();g.add(m);g.userData.wedge=1;return g}
function upgradeGarnish(gl){if(!gl.garnM||gl.garnM.userData.wedge||!gl.c.garnish||!['g_lime','g_lemon','g_orange'].includes(gl.c.garnish))return;const n=gl.def.inner;const w=wedgeMesh(gl.c.garnish);gl.g.remove(gl.garnM);w.position.set(n.rt*.82,n.t+.006,.004);w.rotation.set(0,0,-.95);gl.g.add(w);gl.garnM=w}
function vqTick(dt,t){for(const gl of GLASSOBJS){if(!gl.vq){gl.vq=1;try{upgradeGlass(gl);applyGfx(gl.g)}catch(e){console.warn(e)}}try{glassFx(gl,dt,t);upgradeGarnish(gl)}catch(e){}}}
/* ---------- visual quality: bottles / people / room ---------- */
function vqBottles(){if(!HQ())return;for(const k in ST.bottles){const b=ST.bottles[k];b.traverse(o=>{if(o.isMesh&&o.material&&o.material.isMeshPhysicalMaterial&&o.material.transparent&&!o.userData.vq){o.userData.vq=1;const m=o.material;m.userData.tx=.55;m.userData.op0=m.opacity;m.userData.op1=.9;m.thickness=.04;m.ior=1.5;m.roughness=.04;m.attenuationColor=m.color.clone();m.attenuationDistance=.12;m.needsUpdate=true}})
 const I=ING[k];if(I&&I.type==='spirit'&&!b.userData.inner){const sh=BSHAPE[k]||BSHAPE.gin;if(sh.carton||sh.can)continue;const lq=new THREE.Mesh(new THREE.CylinderGeometry(.026,.026,.13,20),new THREE.MeshPhysicalMaterial({color:new THREE.Color(I.color),transparent:true,opacity:.75,roughness:.05,transmission:.3,thickness:.03,depthWrite:false}));lq.position.y=.075;lq.renderOrder=1;lq.raycast=()=>{};b.add(lq);b.userData.inner=lq}}}
let BEAMS=null,MOTES=null;
function vqRoom(){if(!HQ()||BEAMS)return;BEAMS=new THREE.Group();const bm=new THREE.MeshBasicMaterial({color:0xffc888,transparent:true,opacity:.05,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false});
 for(const p of (LIGHTS.pend||[])){const c=new THREE.Mesh(new THREE.ConeGeometry(.55,1.7,24,1,true),bm);c.position.set(p.position.x,p.position.y-.9,p.position.z);c.raycast=()=>{};BEAMS.add(c)}scene.add(BEAMS);
 const n=160;const g=new THREE.BufferGeometry();const a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=rnd(-2.5,2.5);a[i*3+1]=rnd(1.2,2.8);a[i*3+2]=rnd(-1.8,.2)}g.setAttribute('position',new THREE.BufferAttribute(a,3));MOTES=new THREE.Points(g,new THREE.PointsMaterial({color:0xffe0b0,size:.006,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));MOTES.raycast=()=>{};scene.add(MOTES)}
function vqRoomTick(dt){if(BEAMS){const L=LIGHTSET[(S&&S.light)||'warm']||LIGHTSET.warm;BEAMS.children.forEach(c=>c.material.color.setHex(L.pend));BEAMS.visible=!lowQ()&&!BLACK&&!PERF}if(MOTES){const p=MOTES.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*.02;if(y<1.1)y=2.8;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(T*.5+i)*dt*.01)}p.needsUpdate=true}}

function applyGfx(root){const hi=gfxLv()==='high';(root||scene).traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;const ms=Array.isArray(o.material)?o.material:[o.material];for(const m of ms){if(!m||!m.isMeshPhysicalMaterial)continue;const u=m.userData;if(u.tx==null){if(!(m.transmission>0))continue;u.tx=m.transmission;u.op1=m.opacity;u.op0=Math.min(m.opacity,.82)}const want=hi?u.tx:0;if(m.transmission!==want){m.transmission=want;m.opacity=hi?(u.op1??m.opacity):(u.op0??m.opacity);m.transparent=true;m.needsUpdate=true}}});
 if(MOTES)MOTES.visible=hi;if(BEAMS)BEAMS.visible=!lowQ()&&!BLACK&&!PERF}
const FPSM={t:0,n:0,sum:0,slow:0};
function fpsMonitor(){const nw=performance.now();const dt=Math.min(.5,(nw-(FPSM.last||nw))/1000);FPSM.last=nw;if((SET.quality||'auto')!=='auto'||IS_TOUCH||!S||S.phase!=='service'||document.hidden)return;FPSM.t+=dt;FPSM.n++;FPSM.sum+=dt;if(FPSM.t<2.5)return;const avg=FPSM.sum/FPSM.n;FPSM.t=0;FPSM.n=0;FPSM.sum=0;
 if(avg>1/38){FPSM.slow++;if(FPSM.slow>=2&&AUTOQ!=='low'){AUTOQ=AUTOQ==='high'?'mid':'low';FPSM.slow=0;fit();toast(`🖥 動きが重いので、画質を自動で「${AUTOQ==='mid'?'標準':'軽量'}」に下げました（設定で変更できます）`)}}else FPSM.slow=0}

$('#vsBtn').onclick=e=>{e.stopPropagation();vsStart()};$('#vsBtn').onpointerdown=e=>e.stopPropagation();
$('#loading').remove();
showTitle();
requestAnimationFrame(frame);
