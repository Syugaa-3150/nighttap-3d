 const A=P.act;let pouring=false;

 ST.taps.forEach((tp,i)=>{let target=0;if(A&&A.kind==='tap'&&A.i===i)target=clamp((P.y-A.y0)/110,0,1);tp.pull+=(target-tp.pull)*Math.min(1,dt*14);tp.piv.rotation.x=tp.pull*.85;

   if(gl&&DF().assist&&A&&A.kind==='tap'&&A.i===i){const ac=activeCust();const r=ac&&RECIPES[ac.order];const fills=r?Object.keys(r.ings).filter(x=>r.ings[x]==='fill'):[];const goal=fills.length>1?.47:.94;if(gl.fill()>=goal){P.act=null;loopSet('pour',false);floatAt(gl.g.position.clone().add(V(0,.25,0)),'ちょうどいい！','#7cff9a',20);sfx.ok()}}
   const top=gl?gl.g.position.y+gl.def.inner.b+gl.levelH(Math.min(1,gl.fill())):.91;const y0=1.13;tp.stream.visible=true;tp.stream.scale.set(1+flow,y0-top,1+flow);tp.stream.position.set(tp.x,(y0+top)/2,-.42)}
  else tp.stream.visible=false});
 if(A&&A.kind==='tap'){const gT=SLOTS.find(s=>s.id==='T'+A.i).glass;loopSet('pour',ST.taps[A.i].pull>.06,450+(gT?gT.fill():0)*1000,.04+.08*ST.taps[A.i].pull);if(gT&&A&&!A.inZ){const r0=activeCust()&&RECIPES[activeCust().order];if(r0&&gT.fill()>=fillBand(r0)[0]){A.inZ=1;ding()}}}
 // pour bottle
 if(A&&A.kind==='pour'){const up=A.y0-P.y;A.raise=rankIdx()>=1?clamp((up-10)/130,0,1):0;A.tilt=clamp(.35+(P.y-A.y0)/120,.35,1);if(A.raise>0)A.tilt=.6;A.tv=(A.tv||0)+(A.tilt-(A.tv||0))*Math.min(1,dt*9);
  const I=ING[A.k];const fk=clamp((A.tv-.12)/.2,0,1)*A.tv;let amt=I.rate*fk*(S.up.jigger?.65:1)*dt;
  if(S.stock[A.k]<=0){msgNoStock(A.k);P.act=null;H=null}else if(amt>0){amt=Math.min(amt,S.stock[A.k]);addLiquid(A.glass,A.k,amt);pouring=true;A.glass.wob=Math.min(1.2,(A.glass.wob||0)+dt*4);
   G.glugT=(G.glugT||0)-dt;if(G.glugT<=0){G.glugT=rnd(.1,.17)/(.6+A.tv);glug(A.glass.fill())}

   if(A.raise>.55){A.highT=(A.highT||0)+dt;if(A.highT>.8&&!A.hp){A.hp=1;addTrick(A.glass,'ハイポア')}}
   zoneCheck(A);assistPour(A)}
  loopSet('pour',fk>0,500+A.glass.fill()*1300,(.04+.06*A.tv)*(fk>0?1:0))}
 if(A&&A.kind==='strain'){A.tilt=clamp(.4+(P.y-A.y0)/120,.4,1);const sh=G.shaker,tg=A.glass;const tot=sh.liquid();if(tot>.5){let amt=Math.min(tot,80*A.tilt*dt);const free=tg.cap()-tg.vol();if(free<=0){tg.c.overflow=true;sh.c.water=Math.max(0,sh.c.water-amt*(sh.c.water/tot));for(const k in sh.c.ings)sh.c.ings[k]-=amt*(sh.c.ings[k]/tot);G.stats.waste+=amt}else{const ratio=Math.min(amt,free)/tot;for(const k in sh.c.ings){const m=sh.c.ings[k]*ratio;sh.c.ings[k]-=m;tg.c.ings[k]=(tg.c.ings[k]||0)+m}const wm=sh.c.water*ratio;sh.c.water-=wm;tg.c.water+=wm;if(sh.c.shaken)tg.c.shaken=sh.c.shaken;if(sh.c.tricks)tg.c.tricks=[...new Set([...(tg.c.tricks||[]),...sh.c.tricks])];tg.wob=1;if(Math.random()<.5)emit(surf(tg),mixColor(sh.c.ings),1,.15);if(sh.c.stirred)tg.c.stirred=sh.c.stirred}
   for(const k in sh.c.ings)if(sh.c.ings[k]<.3)delete sh.c.ings[k];pouring=true;loopSet('pour',true,1100,.07)}
  else{loopSet('pour',false);if(!sh.c.done){sh.c.done=1;floatAt(tg.g.position.clone().add(V(0,.25,0)),'注ぎ終わり！','#bff6f2',16)}}}
 // foam settle
 for(const gl of GLASSOBJS){if(gl.c.foam>0&&!(gl.loc&&gl.loc.kind==='slot'&&gl.loc.slot.kind==='tap'&&ST.taps[gl.loc.slot.tap].pull>.06)){const d=gl.c.foam*.022*dt;gl.c.foam-=d;const tk=Object.keys(gl.c.ings).find(k=>ING[k].type==='tap');if(tk)gl.c.ings[tk]+=d*.25}}
 if(S.up.dish){G.dishT+=dt;if(G.dishT>=3){G.dishT=0;if(G.dirty.length)washOne()}}
 if(G.evalT>0){G.evalT-=dt;if(G.evalT<=0)$('#evalPop').style.display='none'}
 if(G.closing&&!G.ended&&G.customers.length===0&&!G.tutorial)endDay();
 D.ticket=1;
}

let glowing=[];
function glowRoot(r,col,int){r.traverse(o=>{if(o.isMesh&&o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach((m,i)=>{if(!m.emissive)return;if(!o.userData.own){o.material=Array.isArray(o.material)?o.material.map(x=>x.clone()):o.material.clone();o.userData.own=1}const mm=Array.isArray(o.material)?o.material[i]:o.material;if(mm.userData.e0===undefined){mm.userData.e0=mm.emissive.getHex();mm.userData.i0=mm.emissiveIntensity}mm.emissive.setHex(col);mm.emissiveIntensity=int;glowing.push(mm)})}})}
function clearGlow(){for(const m of glowing){m.emissive.setHex(m.userData.e0);m.emissiveIntensity=m.userData.i0}glowing=[]}
function hlTargets(hl){const out=[];if(!hl||!G)return out;const [a,b]=hl.split(':');
 if(a==='bottle')out.push(ST.bottles[b]);else if(a==='tap'){const tp=ST.taps.find(x=>x.k===b);if(tp)out.push(tp.piv)}else if(a==='garnish')out.push(ST.garn[b]);else if(a==='rack')out.push(ST.rack[b].g);else if(a==='ice')out.push(ST.ice);else if(a==='spoon')out.push(ST.spoon);else if(a==='sink')out.push(ST.sink.g);
 else if(a==='shaker'){if(G.shaker.loc.kind==='slot')out.push(G.shaker.g)}
 else if(a==='mat')SLOTS.filter(s=>s.kind==='mat'&&!s.glass).forEach(s=>out.push(s.mesh));
 else if(a==='drip'){}
 else if(a==='glass'){const ac=activeCust();const w=ac&&workGlass(ac.order);if(w&&w.loc.kind==='slot')out.push(w.g)}
 else if(a==='serve'){const ac=activeCust();if(ac)out.push(ac.m.g)}
 else if(a==='callers')G.customers.filter(c=>c.status==='waiting').forEach(c=>out.push(c.m.g));
 else if(a==='tables')G.seats.filter(s=>s.money||s.glasses.length).forEach(s=>out.push(SEATOBJ[s.i].money.visible?SEATOBJ[s.i].money:(s.glasses[0]&&s.glasses[0].g)));

 $('#sGyro').onclick=async()=>{await gyroEnable(!GY.on);showSettings();if(G&&S.phase==='service')G.paused=true};$('#sGyroC').onclick=()=>{gyroRecenter();toast('いまの向きを正面にしました')};
 $('#sFull').onclick=()=>{try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>toast('この画面では全画面にできません'))}catch(e){toast('この画面では全画面にできません')}};
 if(S)bindDiffSel(()=>{showSettings()});
 $('#sClose').onclick=()=>{if(prev==='shop'){openShop();return}if(prev==='title'){showTitle();return}if(prev==='report'){closeOv();return}closeOv();if(G)G.paused=was&&false}}

/* ====================== LABELS / ARROW ====================== */
const LABELS=[
 {n:'① グラス棚',sub:'グラスを取る',p:V(-1.18,1.12,-.3),k:'rack'},
 {n:'② シェイカー',sub:'カクテル用',p:V(-.76,1.13,-.2),k:'shaker'},
 {n:'③ バースプーン',sub:'混ぜる',p:V(-.76,1.3,-.42),k:'spoon'},
 {n:'④ 氷',sub:'すくう',p:V(-.52,1.05,-.22),k:'ice'},
 {n:'⑤ ボトル棚',sub:'奥：お酒 ／ 手前：割り材',p:V(.02,1.3,-.51),k:'bottle'},
 {n:'⑥ 作業マット',sub:'ここで作る',p:V(.01,.93,-.08),k:'mat'},
 {n:'⑦ フルーツ',sub:'飾り',p:V(.55,1.0,-.25),k:'garnish'},
 {n:'⑧ ビールタップ',sub:'ハンドルを手前に引く',p:V(1.04,1.48,-.54),k:'tap'},
 {n:'⑨ シンク',sub:'洗う・捨てる',p:V(1.52,1.0,-.27),k:'sink'},
];
function renderLabels(hl){const box=$('#labels');if(!SET.labels&&!G.tutorial){if(box.innerHTML)box.innerHTML='';return}
 const hk=(hl||'').split(':')[0];let h='';
 for(const L of LABELS){const p=toScreen(L.p);if(!p.vis||p.x<-40||p.x>1320)continue;const on=hk===L.k||(hk==='glass'&&L.k==='mat');h+=`<div class="slab ${on?'on':''}" style="left:${p.x.toFixed(0)}px;top:${p.y.toFixed(0)}px">${L.n}<small>${L.sub}</small></div>`}
 if(h!==renderLabels.l){box.innerHTML=h;renderLabels.l=h}}
const _b=new THREE.Box3();
function renderArrow(hl,txt){const ar=$('#arrow');if((!SET.arrow&&!G.tutorial)||!hl||P.act){ar.style.display='none';return}
 const t=hlTargets(hl);if(!t.length){ar.style.display='none';return}
 _b.setFromObject(t[0]);const c=_b.getCenter(new THREE.Vector3());c.y=_b.max.y+.015;const p=toScreen(c);
 let lab=hl.startsWith('serve')||hl==='callers'?'ここをクリック':hl.startsWith('tap')?'押して手前に引く':hl==='sink'&&!(H&&H.kind==='glass')?'押してこする':hl==='glass'&&H&&H.kind==='spoon'?'押してぐるぐる':hl==='glass'&&H&&H.kind==='bottle'?'ここで長押し':hl==='shaker'&&H&&H.glass===G.shaker?'押したまま振る':'ここ！';
 ar.classList.remove('side');let arrowCh='⬇';let x=p.x,y=p.y;
 if(!p.vis){ar.style.display='none';return}
 if(x<40){x=70;y=clamp(y,150,600);arrowCh='⬅';lab=touchMode?'◀ボタンで左を見る':'左を見て（マウスを左端へ）';ar.classList.add('side')}
 else if(x>1240){x=1180;y=clamp(y,150,600);arrowCh='➡';lab=touchMode?'▶ボタンで右を見る':'右を見て（マウスを右端へ）';ar.classList.add('side')}
 else if(y<60){y=110;arrowCh='⬆';lab=touchMode?'⬆客席ボタン':'上を見て（マウスを上へ）'}
 else if(y>700){y=640;arrowCh='⬇';lab=touchMode?'⬇手元ボタン':'下を見て（マウスを下へ）'}
 ar.style.display='block';ar.style.left=x+'px';ar.style.top=(y-4)+'px';const hh=`<div class="al">${lab}</div><div class="ar">${arrowCh}</div>`;if(ar.innerHTML!==hh)ar.innerHTML=hh}

/* ====================== TUTORIAL ====================== */
const TUT=[
 {t:'ようこそ！ ここはあなたのバー。画面は<b>あなたの目線</b>です。<br>マウスを<b>上</b>に動かすと客席、<b>下</b>に動かすと手元の作業台。<b>左右の端</b>に寄せると首を振れます。ちょっと動かしてみよう。',btn:'見回せた！'},
 {t:'水色の<b>札</b>が場所の名前です（①グラス棚 〜 ⑨シンク）。<br>覚えなくてOK！ やることは毎回<b>黄色い矢印⬇</b>と、この枠の<b>「次は」</b>が教えてくれます。<br>持っている物は<b>右クリック</b>でいつでも戻せます。',btn:'わかった'},
 {t:'お客さんが来ました！ 頭の上の<b>「🙋注文！」</b>のお客さんをクリックして注文を聞こう。',enter(){tutSpawn('pale')},done:()=>G.customers.some(c=>c.status==='ordered'),hl:'callers'},
 {t:'注文は<b>ペールエール</b>（ビール）。右上の<b>伝票</b>に手順が出ます。<br>ビールはグラスを持ったまま<b>タップのハンドルを押して手前（下）へ引く</b>と注げます。強く引くほど泡が増えるよ。',done:()=>G.stats.served>=1,dyn:1},
 {t:'ナイス！🍺 お客さんが飲んでいます。飲み終わると<b>お会計とグラス</b>がカウンターに残ります。少し待ってね…',done:()=>G.seats.some(s=>s.money>0)},
 {t:'カウンターの<b>💴お会計</b>をクリックして回収しよう。空きグラスは自動でシンクへ。<br>（片付けないと、その席に次のお客さんが座れません）',done:()=>!G.seats.some(s=>s.money>0||s.glasses.length),hl:'tables'},
 {t:'次のお客さん！ クリックして注文を聞こう。',enter(){tutSpawn('highball')},done:()=>G.customers.some(c=>c.status==='ordered'),hl:'callers'},
 {t:'注文は<b>ハイボール</b>。氷・ボトル・ステア（混ぜる）・レモンを使います。<br>ボトルは<b>持ってグラスの上で長押し</b>。ステアは<b>スプーンを持ってグラスの上でぐるぐる</b>。',done:()=>G.stats.served>=2,dyn:1},
 {t:'最後に洗い物！ 汚れたグラスがシンクにあります。<br><b>シンクを押したまま、マウスを左右にこする</b>と洗えます。',done:()=>G.dirty.length===0,hl:'sink'},
 {t:'🎉 <b>チュートリアル完了！</b><br>本番では次々にお客さんが来ます。迷ったら<b>矢印</b>と<b>右上の伝票</b>を見てね。<br>難易度はいつでも一時停止メニューから変えられます。',btn:'営業スタート！',end:1},
];
function tutSpawn(order){G.forceOrder=order;G.forceType='office';const seat=G.seats.find(s=>s.i===1&&seatFree(s))||G.seats.find(seatFree);if(!seat)return;const save=G.seats.map(s=>s.i);spawnCustomer(true);const c=G.customers[G.customers.length-1];if(c&&c.seat!==seat.i){G.seats[c.seat].cust=null;c.seat=seat.i;seat.cust=c;c.target=V(SEATX[seat.i],0,-1.36)}}
function startTutorial(after){S.phase='service';newDay();G.tutorial={st:-1,after};closeOv();tutGo(0)}
function tutGo(i){G.tutorial.st=i;const s=TUT[i];if(s&&s.enter)s.enter();tutRender.last=null;tutRender()}
function tutUpdate(){const s=TUT[G.tutorial.st];if(s&&s.done&&s.done())tutGo(G.tutorial.st+1)}
function tutRender(){const s=TUT[G.tutorial.st];const el=$('#tut');if(!s){el.style.display='none';return}
 const nh=s.dyn||s.hl==='callers'||s.hl==='tables'||s.hl==='sink'?nextHint().t:'';
 const html=`<div class="th"><span>📘 チュートリアル ${G.tutorial.st+1} / ${TUT.length}</span><span style="color:#aaa;cursor:pointer" id="tutSkip">スキップ ✕</span></div><div class="tt">${s.t}</div>${nh&&!s.btn?`<div class="nx"><b>次は▶</b> ${nh}</div>`:''}${s.btn?`<div class="row"><button class="btn sm" id="tutBtn">${s.btn}</button></div>`:''}`;
 el.style.display='block';if(html===tutRender.last)return;tutRender.last=html;el.innerHTML=html;
 const b=$('#tutBtn');if(b)b.onclick=()=>{sfx.pop();if(s.end){tutFinish();return}tutGo(G.tutorial.st+1)};
 $('#tutSkip').onclick=()=>tutFinish()}
function tutFinish(){const after=G.tutorial&&G.tutorial.after;S.tutDone=1;$('#tut').style.display='none';G.tutorial=null;
 const s0=load();if(after==='shop'&&s0){S=s0;S.tutDone=1;applyDiff();newDay();openShop('stock');return}
 S.day=Math.max(1,S.day);startService()}

/* ====================== DIFFICULTY UI ====================== */
function diffCards(cur){return `<div class="dgrid">${Object.keys(DIFF).map(k=>{const d=DIFF[k];return `<div class="dcard ${cur===k?'on':''}" data-diff="${k}"><div style="font-size:34px">${d.icon}</div><b>${d.name}</b>${d.desc}</div>`}).join('')}</div>`}
function diffSel(){return `<div class="dsel">難易度：${Object.keys(DIFF).map(k=>`<button data-dset="${k}" class="${S.diff===k?'on':''}">${DIFF[k].name}</button>`).join('')}</div>`}
function bindDiffSel(after){document.querySelectorAll('[data-dset]').forEach(b=>b.onclick=()=>{S.diff=b.dataset.dset;applyDiff();save();sfx.pop();toast('難易度：'+DF().name);after&&after()})}
function newGameFlow(){openOv(`<div class="modal" style="width:860px"><h1>難易度をえらぶ</h1><p style="font-size:13px;color:#f5e6c8bb">あとからいつでも変えられます。はじめての人は「かんたん」がおすすめ！</p>${diffCards('easy')}<div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn sec" id="dBack">戻る</button></div></div>`);
 $('#dBack').onclick=showTitle;
 document.querySelectorAll('[data-diff]').forEach(c=>c.onclick=()=>{ac();S=freshSave();syncOriginals();S.diff=c.dataset.diff;applyDiff();save();sfx.pop();
  openOv(`<div class="modal" style="width:560px;text-align:center"><h1>チュートリアルをやりますか？</h1><p style="line-height:1.8">お客さん2人を相手に、<b style="color:#ffd77a">ビール</b>と<b style="color:#ffd77a">ハイボール</b>の作り方、<br>お会計と洗い物を1つずつ練習します（約3分・時間制限なし）。</p><div class="tbtns"><button class="btn" id="tY">やる（おすすめ）</button><button class="btn sec" id="tN">スキップして営業開始</button></div></div>`);
  $('#tY').onclick=()=>startTutorial('day1');$('#tN').onclick=()=>startService()})}
/* ====================== BOOT ====================== */
buildRoom();buildStation();
S=load()||freshSave();S.phase='title';syncOriginals();applyDiff();newDay();
$('#loading').remove();
showTitle();
requestAnimationFrame(frame);

</script>
