function placeGlass(gl,slot){slot.glass=gl;gl.loc={kind:'slot',slot};gl.g.position.copy(slot.pos);gl.g.rotation.set(0,0,0)}
function freeSlot(gl,pt,maxD=.3){let best=null,bd=maxD;for(const s of SLOTS){if(s.glass)continue;if(PUDDLES.length&&puddleNear(s.pos))continue;if(s.kind==='home'&&gl.type!=='shaker')continue;if(gl.type==='shaker'&&s.kind==='tap')continue;const d=Math.hypot(s.pos.x-pt.x,s.pos.z-pt.z);if(d<bd){bd=d;best=s}}return best}
function slotGlassNear(pt,maxD=.13,exclude){let best=null,bd=maxD;for(const s of SLOTS){if(!s.glass||s.glass===exclude)continue;const d=Math.hypot(s.pos.x-pt.x,s.pos.z-pt.z);if(d<bd){bd=d;best=s.glass}}return best}

function tol(){return DF().tol+(S.up.jigger?.07:0)+(S.flags&&S.flags.gen?.05:0)}

const FOAM=[.18,.35];

function evaluate(gl,rid){
 const r=RR(rid),c=gl.c;const fb=r.foam||FOAM;let s=100;const n=[];
 if(gl.type!==r.glass){s-=35;n.push('グラスが違う')}
 if(!!c.ice!==r.ice){s-=12;n.push(r.ice?'氷が入っていない':'氷は不要')}
 const fills=Object.keys(r.ings).filter(k=>r.ings[k]==='fill');
 for(const k in r.ings){const t=r.ings[k],a=c.ings[k]||0;if(a<1){s-=35;n.push(ING[k].name+'が入っていない');continue}
  if(t!=='fill'){const e=Math.abs(a-t)/t;if(e>tol()){s-=Math.min(25,Math.round((e-tol())*70)+6);n.push(`${ING[k].name}が${a>t?'多い':'少ない'}（${Math.round(a)}ml/${t}ml）`)}}}
 for(const k in c.ings)if(!(k in r.ings)&&c.ings[k]>2){s-=20;n.push(ING[k].name+'は入れない')}
 if(fills.length){const f=gl.fill(),[lo]=fillBand(r);if(c.overflow){s-=10;n.push('こぼした')}
  if(f<lo){s-=Math.min(30,Math.round((lo-f)*110));n.push(`量が少ない（${Math.round(f*100)}%）`)}
  if(fills.length>1){const tot=fills.reduce((a,k)=>a+(c.ings[k]||0),0);if(tot>0)for(const k of fills){if(Math.abs((c.ings[k]||0)/tot-1/fills.length)>.15){s-=12;n.push('割合が偏っている（半々に）');break}}}}
 if(r.method==='tap'){const fr=foamR(gl);if(fr<fb[0]){s-=Math.min(22,Math.round((fb[0]-fr)*120)+4);n.push(`泡が少ない（${Math.round(fr*100)}%・理想は2〜3割）`)}else if(fr>fb[1]){s-=Math.min(25,Math.round((fr-fb[1])*100)+4);n.push(`泡が多すぎ（${Math.round(fr*100)}%）`)}}
 if(r.method==='shake'){if(!c.shaken){s-=30;n.push('シェイクしていない')}else if(c.shaken==='ok')s-=6;else if(c.shaken==='bad'){s-=16;n.push('シェイクの加減がイマイチ')}}
 else if(c.shaken){s-=10;n.push('シェイクは不要')}
 if(r.method==='stir'){if(!c.stirred){s-=12;n.push('ステアしていない')}else if(c.stirred==='ok')s-=3;else if(c.stirred==='bad'){s-=9;n.push('ステアの加減がイマイチ')}}
 if(r.garnish){if(!c.garnish){s-=10;n.push(ING[r.garnish].name+'を飾り忘れ')}else if(c.garnish!==r.garnish){s-=6;n.push('ガーニッシュが違う')}}else if(c.garnish)s-=3;
 if(DF().noAngry)s=100-(100-s)*.5;return{score:clamp(Math.round(s),0,100),notes:n}}

 let s=`<svg viewBox="0 0 100 140" width="${w}" height="${w*1.4}"><defs><clipPath id="${id}"><path d="${g.i}"/></clipPath></defs>`;if(!g.mug)s+=`<path d="${g.o}" fill="url(#glassG)"/>`;
 s+=`<g clip-path="url(#${id})"><rect x="0" y="${y}" width="100" height="${140-y}" fill="${o.color}" opacity=".9"/>${o.foam?`<rect x="0" y="${y-2}" width="100" height="${H2*.12}" fill="#fff4dc"/>`:''}</g>`;
 if(g.mug)s+=`<path d="${g.o}" fill="url(#copper)" opacity=".75"/>`;s+=`<path d="${g.o}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3"/>`;
 if(o.garnish){const [rx,ry]=g.rim;s+=`<circle cx="${rx}" cy="${ry}" r="12" fill="${ING[o.garnish].color}"/>`}return s+'</svg>'}
function bottleSVG(k,w=30){const I=ING[k];return `<svg viewBox="0 0 40 70" width="${w}" height="${w*1.75}"><path d="M15,8 L25,8 L25,20 Q34,24 34,32 L34,66 L6,66 L6,32 Q6,24 15,20 Z" fill="${I.bottle||I.color}" stroke="#0006"/><rect x="9" y="38" width="22" height="16" rx="2" fill="#f5ead0"/><rect x="9" y="40" width="22" height="4" fill="${I.color}"/></svg>`}
function iconFor(k){const I=ING[k];if(I.type==='tap')return `<svg viewBox="0 0 40 60" width="34" height="50"><rect x="13" y="2" width="14" height="34" rx="6" fill="${I.handle}"/><rect x="15" y="10" width="10" height="14" fill="#f5ead0"/><rect x="2" y="38" width="36" height="10" rx="4" fill="url(#metal)"/></svg>`;if(I.type==='garnish')return `<svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="15" fill="${I.color}"/><circle cx="20" cy="20" r="11" fill="#fffbe0" opacity=".8"/></svg>`;return bottleSVG(k)}
function recipeColor(r){return mixColor(Object.fromEntries(Object.keys(r.ings).map(x=>[x,r.ings[x]==='fill'?100:r.ings[x]])))}
function recipeText(k){const r=RECIPES[k];const p=[GL[r.glass].full];if(r.method==='shake')p[0]='シェイカー→'+p[0];if(r.ice)p.push('氷');for(const x in r.ings)p.push(r.ings[x]==='fill'?(ING[x].type==='tap'?ING[x].short+'をタップで（泡2〜3割）':ING[x].short+'で満たす'):ING[x].short+r.ings[x]+'ml');if(r.method==='shake')p.push('シェイク');if(r.method==='stir')p.push('ステア');if(r.garnish)p.push(ING[r.garnish].short);return p.join(' → ')}

function origVols(d){const cap=GL[d.glass].cap;const ks=d.ings.filter(x=>x.k);const fixed=ks.filter(x=>x.amt!=='fill'),fills=ks.filter(x=>x.amt==='fill');const fv=fixed.reduce((a,x)=>a+x.amt,0);const iceV=d.ice?cap*.35:0;const remain=Math.max(0,cap*.88-iceV-fv);const vols={};fixed.forEach(x=>vols[x.k]=(vols[x.k]||0)+x.amt);fills.forEach(x=>vols[x.k]=(vols[x.k]||0)+remain/fills.length);return{vols,total:Object.values(vols).reduce((a,b)=>a+b,0),fv,cap,iceV,ks,fills}}

 {c:'ひまな時間①',t:'注文がない時間は<b>準備のチャンス</b>！<br>⑫<b>丸氷</b>を押したまま、<b>ぐるぐる円を描いて</b>削ろう。丸氷はウイスキー系の注文で自動で使われてチップUP。',goals:[['⑫丸氷を1個つくる',()=>(G.roundIce||0)>0]],hl:'roundice'},
 {c:'ひまな時間②',t:'お客さんとの<b>雑談</b>や、お店の<b>雰囲気</b>づくりもバーテンダーの仕事。<br>画面右上の <b>🎵</b> ボタン（雰囲気）で、音楽と照明を変えてみよう（来るお客さんのタイプが変わる）。',enter(){fpsUnlock()},goals:[['右上の🎵ボタンを押して 音楽か照明を選ぶ',()=>G.tutMood]]},
 {c:'もっと遊ぶ',t:'ほかにも、ひまな時間にできること：<br>💬 <b>雑談</b>：飲んでいるお客さんをクリック → 返事を選ぶ<br>🔪 <b>仕込み</b>：スライスを8枚以上ためるとピーク中チップ+15%<br>✨ <b>磨き上げ</b>：濡れたグラスがない時も布でカゴを磨く<br>🧼 <b>清潔度</b>：布で空いた客席カウンターをこする（左上のメーター）<br>🍾 <b>フレア練習</b>：ボトルを持って円を2周→キャッチ。5回でLvUP<br>👅 <b>試作</b>：自由に注いだグラスを持って👅味見ボタン（PCはTキー）',btn:'わかった'},
 {c:'完了',t:'🎉 <b>チュートリアル完了！</b><br>迷ったら<b>光っている物</b>と画面下の<b>「次は▶」</b>。注文がない時は「次は▶」が暇つぶしを提案してくれます。<br>商品名の表示・名札・感度は ⚙設定 で変えられます。',btn:'営業スタート！',end:1},
];
function tutSpawn(order){G.forceOrder=order;G.forceType='office';const seat=G.seats.find(s=>s.i===1&&seatFree(s))||G.seats.find(seatFree);if(!seat)return;const save=G.seats.map(s=>s.i);spawnCustomer(true);const c=G.customers[G.customers.length-1];if(c&&c.seat!==seat.i){G.seats[c.seat].cust=null;c.seat=seat.i;seat.cust=c;c.target=V(SEATX[seat.i],0,-1.36)}}
function startTutorial(after){S.phase='service';newDay();G.tutorial={st:-1,after};closeOv();tutGo(0)}
function tutGo(i){G.tutorial.st=i;G.tutMin=false;const s=TUT[i];if(s&&s.enter)s.enter();if(s&&s.btn)fpsUnlock();tutRender.last=null;tutRender()}
function tutGoals(s){const st=G.tutorial.st;G.tutDone=G.tutDone||{};const mem=G.tutDone[st]=G.tutDone[st]||{};if(!s.goals)return[];const gs=typeof s.goals==='function'?s.goals():s.goals;return gs.map((g,i)=>{const lb=typeof g[0]==='function'?g[0]():g[0];const v=typeof g[1]==='function'?!!g[1]():!!g[1];if(typeof s.goals!=='function'&&v)mem[i]=1;return[lb,typeof s.goals==='function'?v:!!mem[i]]})}
function tutUpdate(){if(H&&H.kind==='glass')G.tutHeld=1;const s=TUT[G.tutorial.st];if(!s)return;if(s.done?s.done():(s.goals&&tutGoals(s).every(g=>g[1]))){sfx.ok&&sfx.ok();tutGo(G.tutorial.st+1)}}
function tutRender(){const s=TUT[G.tutorial.st];const el=$('#tut');if(!s){el.style.display='none';return}
 const nh=s.dyn?nextHint().t:'';const tx=typeof s.t==='function'?s.t():s.t;const ti=G.tutorial.st,tn=TUT.length;const gl=tutGoals(s);const gh=gl.length?`<div class="tgoals">${gl.map(g=>`<div class="${g[1]?'ok':''}">${g[1]?'✅':'⬜'} ${g[0]}</div>`).join('')}</div>`:'';
 const html=`<div class="th"><span>📘 チュートリアル <b style="color:#ffd77a">${s.c||''}</b> <small style="color:#aaa">${ti+1}/${tn}</small></span><span><span style="color:#ffd77a;cursor:pointer;margin-right:12px" id="tutMin">${G.tutMin?"▼説明を開く":"▲たたむ"}</span><span style="color:#aaa;cursor:pointer" id="tutSkip">スキップ ✕</span></span></div><div class="tprog"><i style="width:${Math.round(ti/(tn-1)*100)}%"></i></div>${G.tutMin?'':`<div class="tt">${tx}</div>`}${gh}${nh&&!s.btn?`<div class="nx"><b>次は▶</b> ${nh}</div>`:''}${s.btn||s.skip?`<div class="row"><button class="btn sm" id="tutBtn">${s.btn||s.skip}</button>${s.btn&&FPS.on?'<small style="color:#aaa;margin-left:8px">Enterでも進む</small>':''}</div>`:''}`;
 el.style.display='block';if(html===tutRender.last)return;tutRender.last=html;el.innerHTML=html;
 const b=$('#tutBtn');if(b)b.onclick=()=>{sfx.pop();if(s.end){tutFinish();return}tutGo(G.tutorial.st+1)};
 $('#tutSkip').onclick=()=>tutFinish();$('#tutMin').onclick=()=>{G.tutMin=!G.tutMin;tutRender.last=null;tutRender()}}
function tutFinish(){const after=G.tutorial&&G.tutorial.after;S.tutDone=1;$('#tut').style.display='none';G.tutorial=null;
 const s0=load();if(after==='shop'&&s0){S=s0;S.tutDone=1;applyDiff();newDay();openShop('stock');return}
 S.day=Math.max(1,S.day);startService()}

/* ====================== DIFFICULTY UI ====================== */
function diffCards(cur){return `<div class="dgrid">${Object.keys(DIFF).map(k=>{const d=DIFF[k];return `<div class="dcard ${cur===k?'on':''}" data-diff="${k}"><div style="font-size:34px">${d.icon}</div><b>${d.name}</b>${d.desc}</div>`}).join('')}</div>`}
function diffSel(){return `<div class="dsel">難易度：${Object.keys(DIFF).map(k=>`<button data-dset="${k}" class="${S.diff===k?'on':''}">${DIFF[k].name}</button>`).join('')}</div>`}
function bindDiffSel(after){document.querySelectorAll('[data-dset]').forEach(b=>b.onclick=()=>{S.diff=b.dataset.dset;applyDiff();save();sfx.pop();toast('難易度：'+DF().name);after&&after()})}
function newGameFlow(){openOv(`<div class="modal" style="width:860px"><h1>難易度をえらぶ</h1><p style="font-size:13px;color:#f5e6c8bb">あとからいつでも変えられます。はじめての人は「かんたん」がおすすめ！</p>${diffCards('easy')}<div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn sec" id="dBack">戻る</button></div></div>`);
 $('#dBack').onclick=showTitle;
 document.querySelectorAll('[data-diff]').forEach(c=>c.onclick=()=>{ac();S=freshSave();syncOriginals();S.diff=c.dataset.diff;applyDiff();save();sfx.pop();
  openOv(`<div class="modal" style="width:560px;text-align:center"><h1>チュートリアルをやりますか？</h1><p style="line-height:1.8">12のチャプターで、<b style="color:#ffd77a">ビール</b>と<b style="color:#ffd77a">ハイボール</b>づくり、カット・洗い物・グラス拭き、<br>そして<b style="color:#ffd77a">ひまな時間の過ごし方</b>（丸氷・雑談・雰囲気づくり）まで練習します（約5分・時間制限なし）。</p><div class="tbtns"><button class="btn" id="tY">やる（おすすめ）</button><button class="btn sec" id="tN">スキップして営業開始</button></div></div>`);
  $('#tY').onclick=()=>startTutorial('day1');$('#tN').onclick=()=>startService()})}
/* ====================== BOOT ====================== */
applyNames();applyBodySet();buildLogoURL();buildRoom();buildStation();
S=load()||freshSave();S.phase='title';syncOriginals();applyDiff();newDay();
$('#loading').remove();
showTitle();
requestAnimationFrame(frame);

</script>
